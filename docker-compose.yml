services:
  patte-a-l-eau:
    build:
      context: .
      args:
        - NEXT_PUBLIC_BASE_URL=https://pattesaleau-toilettage.fr
        - NEXT_PUBLIC_GLITCHTIP_DSN=${NEXT_PUBLIC_GLITCHTIP_DSN:-}
    container_name: patte-a-l-eau
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_GLITCHTIP_DSN=${NEXT_PUBLIC_GLITCHTIP_DSN:-}
      - GLITCHTIP_DSN=${GLITCHTIP_DSN:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
    networks:
      - samy-network

networks:
  samy-network:
    external: true
    name: samy-repare_samy-network
